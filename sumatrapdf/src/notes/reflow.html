<!doctype html>
<html lang="zh-CN" data-theme-channel="reflow">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>正文重排</title>
    <link rel="stylesheet" href="reflow.css" />
    <script type="module" src="theme.js"></script>
    <script type="module" src="reflow.js"></script>
  </head>
  <body>
    <nav aria-label="重排阅读">
      <button id="previous" type="button">上一页</button>
      <span id="page-label"></span>
      <button id="next" type="button">下一页</button>
      <span class="spacer"></span>
      <button id="annotate" type="button">AI 注释选中文本</button>
      <button id="original" type="button">原版</button>
      <button type="button" data-theme-toggle title="切换主题" aria-label="切换主题">☾</button>
    </nav>
    <p id="status" role="status"></p>
    <main id="pages"></main>
    <div id="note-actions" role="toolbar" aria-label="注释操作" hidden>
      <span id="note-ipa"></span
      ><button id="speak-note" class="note-action-icon" type="button" title="朗读原文" aria-label="朗读原文">
        <svg
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 7.6h2.9L10 4.2v11.6l-4.1-3.4H3zM13.2 7.3a3.8 3.8 0 0 1 0 5.4M15.6 4.9a7.2 7.2 0 0 1 0 10.2" />
        </svg></button
      ><button id="focus-note" type="button">查看注释</button><button id="delete-note" type="button">删除</button>
    </div>
  </body>
</html>
