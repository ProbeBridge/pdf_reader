<!doctype html>
<html data-theme-channel="notes">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>阅读历史</title>
    <link rel="stylesheet" href="history.css" />
    <script type="module" src="theme.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">SumatraPDF <b>AI</b></div>
      <label class="search"
        ><span aria-hidden="true">⌕</span
        ><input id="search" type="search" placeholder="搜索阅读历史" aria-label="搜索阅读历史" autofocus /><kbd
          >Ctrl F</kbd
        ></label
      ><button id="open">打开文件</button><button id="library" type="button" aria-pressed="false">书库</button
      ><button id="statistics" type="button" aria-pressed="false">阅读统计</button><button id="notes">AI 注释</button
      ><button type="button" data-theme-toggle title="切换主题" aria-label="切换主题">☾</button>
    </header>
    <div class="layout">
      <aside>
        <h1>阅读历史</h1>
        <p>按时间浏览读过的文档</p>
        <nav class="history-navigation" aria-label="阅读页面">
          <button id="library-tab" type="button" class="view-tab" aria-pressed="false">▤　书库</button>
          <button id="history-tab" type="button" class="view-tab selected" aria-pressed="true">◷　阅读历史</button>
          <button id="stats-tab" type="button" class="view-tab" aria-pressed="false">▥　阅读统计</button>
        </nav>
        <p class="aside-hint">文件只存于本机<br />移除记录不会删除文件</p>
      </aside>
      <main>
        <section id="history-panel">
          <div class="heading">
            <h2 id="heading">阅读历史</h2>
            <span id="count"></span>
          </div>
          <div id="groups"></div>
          <div id="empty" hidden>还没有阅读记录。打开一份文档，开始阅读。</div>
        </section>
        <section id="stats-panel" hidden></section>
        <section id="library-panel" hidden></section>
      </main>
    </div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="history.js"></script>
  </body>
</html>
